<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Slideshow</title>
  <!-- Google Fonts: Press Start 2P for pixel style -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
  .slideshow-container {
    width: 600px;
    height: 100px;
    border: 6px solid #3c3c3c;
    box-shadow: 0 8px 32px #000a, 0 0 0 4px #b6a16b;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    background: #222;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  .slide-wrapper {
    display: flex;
    flex-direction: row;
    align-items: center;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    transition: opacity 0.6s cubic-bezier(0.77,0,0.175,1);
    will-change: opacity;
    opacity: 1;
    flex-wrap: nowrap;
  }
    .slide-image {
      width: 80px;
      height: 80px;
      margin-left: 10px;
      object-fit: cover;
      border-radius: 0;
      border: 4px solid #5a7d3a;
      background: #222;
      image-rendering: pixelated;
      box-shadow: 0 0 0 4px #b6a16b;
    }
    .slide-image-right {
      width: 80px;
      height: 80px;
      margin-left: 20px;
      object-fit: cover;
      border: none;
      background: transparent;
      image-rendering: pixelated;
      box-shadow: none;
    }
    .slide-caption {
      margin-left: 20px;
      padding: 8px;
      width: 270px;
      min-height: 60px;
      background: #222;
      border: 4px solid #388e3c;
      border-radius: 0;
      font-size: 22px;
      text-align: left;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="slideshow-container">
    <div class="slide-wrapper" id="slideWrapper">
      <img class="slide-image" id="slideImg" src="https://static-cdn.jtvnw.net/jtv_user_pictures/d69acea7-19dc-4644-9d3b-177d51b81506-profile_image-300x300.png" alt="Minecraft">
      <div class="slide-caption" id="slideCaption">Welcome to the Minecraft stream!</div>
      <img class="slide-image-right" id="slideImgRight" src="https://static-cdn.jtvnw.net/jtv_user_pictures/d69acea7-19dc-4644-9d3b-177d51b81506-profile_image-300x300.png" alt="Right Slot">
    </div>
  </div>
  <script>
    const slides = [
      {
        img: "https://d31sxl6qgne2yj.cloudfront.net/wordpress/wp-content/uploads/20190121140745/Minecraft-Zombie-Head.jpg",
        caption: "Follow = Named Zombie!",
        rightImg: "https://slide-zeta-sepia.vercel.app/Follow.png"
      },
      {
        img: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/f/fc/Iron_Ingot_JE3_BE2.png",
        caption: "Heart Me = 10 Iron!",
        rightImg: "https://tikgiftsvalue.com/wp-content/uploads/2025/05/Heart-Me.webp"
      },
      {
        img: "https://d31sxl6qgne2yj.cloudfront.net/wordpress/wp-content/uploads/20190121140624/Minecraft-Cow-Head.jpg",
        caption: "Finger Heart = Named Cow!",
        rightImg: "https://slide-zeta-sepia.vercel.app/FingerHeart.png"
      },
      {
        img: "https://i.pinimg.com/736x/60/94/a6/6094a6dd01db7c08ea3c0569b978c0d4.jpg",
        caption: "Galaxy = Named Wither!",
        rightImg: "https://i.pinimg.com/736x/94/e2/77/94e277b77da5e2acff5c0190dc807653.jpghttps://png.pngtree.com/png-clipart/20250221/original/pngtree-galaxy-picture-image_370923.png"
      }
    ];
    let current = 0;
    let isFading = false;
    function showSlide(idx) {
      if (isFading) return;
      isFading = true;
      const slideWrapper = document.getElementById('slideWrapper');
      // Fade out
      slideWrapper.style.transition = 'opacity 0.6s cubic-bezier(0.77,0,0.175,1)';
      slideWrapper.style.opacity = 0;
      setTimeout(() => {
        // Change content
        document.getElementById('slideImg').src = slides[idx].img;
        document.getElementById('slideCaption').textContent = slides[idx].caption;
        document.getElementById('slideImgRight').src = slides[idx].rightImg;
        // Fade in
        slideWrapper.style.opacity = 1;
        setTimeout(() => {
          isFading = false;
        }, 600);
      }, 600);
    }
    function nextSlide() {
      const next = (current + 1) % slides.length;
      showSlide(next);
      current = next;
    }
    // Auto-advance every 4 seconds
  setInterval(nextSlide, 4000);
  </script>
</body>
</html>
